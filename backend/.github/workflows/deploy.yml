name: AuthSentinel CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: authsentinel-backend
  AWS_REGION: ap-southeast-1

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: authsentinel_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (test DB)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: authsentinel_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_SSL: false
        run: npm run migrate

      - name: Run tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: authsentinel_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_SSL: false
          JWT_SECRET: test_secret_key_minimum_64_chars_for_testing_purposes_only
        run: npm test

  # ── Job 2: Build & Push Docker ──────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$DOCKER_IMAGE:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$DOCKER_IMAGE:$IMAGE_TAG $ECR_REGISTRY/$DOCKER_IMAGE:latest
          docker push $ECR_REGISTRY/$DOCKER_IMAGE:$IMAGE_TAG
          docker push $ECR_REGISTRY/$DOCKER_IMAGE:latest
          echo 'IMAGE='$ECR_REGISTRY/$DOCKER_IMAGE:$IMAGE_TAG >> $GITHUB_OUTPUT

  # ── Job 3: Deploy ke AWS EC2 ─────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app/authsentinel
            docker pull ${{ secrets.ECR_REGISTRY }}/authsentinel-backend:latest
            docker stop authsentinel-api || true
            docker rm authsentinel-api   || true
            docker run -d \
              --name authsentinel-api \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /app/authsentinel/.env \
              ${{ secrets.ECR_REGISTRY }}/authsentinel-backend:latest
            echo 'Deploy selesai!'
