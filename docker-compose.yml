services:

  frontend:
    image: nginx:alpine
    container_name: authsentinel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - authsentinel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authsentinel-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: false
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      FRONTEND_URL: "*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - authsentinel-net

  postgres:
    image: postgres:15-alpine
    container_name: authsentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authsentinel-net

networks:
  authsentinel-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
